<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClientFlow - CRM</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#111827;
}

/* SIDEBAR */

.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:163px;
background:#101827;
padding:15px 10px;
}

.brand{
display:flex;
align-items:center;
gap:7px;
color:#fff;
font-size:14px;
font-weight:700;
margin-bottom:28px;
}

.brand-icon{
width:26px;
height:26px;
border-radius:6px;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
}

.nav{
list-style:none;
}

.nav li{
margin-bottom:4px;
}

.nav a{
display:block;
padding:9px;
border-radius:7px;
text-decoration:none;
color:#9ca3af;
font-size:11px;
}

.nav a:hover,
.nav a.active{
background:#1d293b;
color:#fff;
}

/* MAIN */

.main{
margin-left:163px;
min-height:100vh;
padding:20px;
}

/* HEADER */

.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.title{
font-size:21px;
font-weight:700;
}

.subtitle{
font-size:10px;
color:#8b95a5;
margin-top:3px;
}

.add-btn{
border:0;
background:#2563eb;
color:white;
padding:9px 13px;
border-radius:6px;
font-size:10px;
font-weight:600;
cursor:pointer;
}

.add-btn:hover{
background:#1d4ed8;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px;
}

.card{
background:white;
border:1px solid #e7eaf0;
border-radius:9px;
padding:15px;
height:69px;
}

.card-title{
font-size:9px;
color:#7b8492;
margin-bottom:7px;
}

.card-value{
font-size:20px;
font-weight:700;
}

/* RECENT LEADS */

.panel{
background:white;
border:1px solid #e7eaf0;
border-radius:9px;
overflow:hidden;
}

.panel-header{
height:52px;
padding:0 14px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #edf0f4;
}

.panel-title{
font-size:13px;
font-weight:700;
}

.search{
width:170px;
height:30px;
border:1px solid #dfe3e8;
border-radius:6px;
padding:0 10px;
font-size:10px;
outline:none;
}

.search:focus{
border-color:#2563eb;
}

/* TABLE */

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:550px;
}

th{
padding:10px 14px;
text-align:left;
font-size:8px;
color:#7b8492;
font-weight:700;
border-bottom:1px solid #edf0f4;
}

td{
padding:13px 14px;
font-size:10px;
border-bottom:1px solid #f0f2f5;
}

tr:last-child td{
border-bottom:0;
}

.empty{
text-align:center;
padding:35px 15px;
color:#9ca3af;
font-size:11px;
}

/* MOBILE */

@media(max-width:700px){

.sidebar{
width:163px;
}

.main{
margin-left:163px;
padding:16px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.header{
align-items:flex-start;
}

}

@media(max-width:500px){

.main{
padding:12px;
}

.stats{
gap:8px;
}

.card{
padding:12px;
}

.card-value{
font-size:18px;
}

.search{
width:140px;
}

}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="brand">

<div class="brand-icon">
C
</div>

<span>ClientFlow</span>

</div>


<ul class="nav">

<li>
<a href="index.html" class="active">
Dashboard
</a>
</li>

<li>
<a href="leads.html">
Leads
</a>
</li>

<li>
<a href="companies.html">
Companies
</a>
</li>

<li>
<a href="activities.html">
Activities
</a>
</li>

</ul>

</aside>


<!-- MAIN -->

<main class="main">

<!-- HEADER -->

<div class="header">

<div>

<div class="title">
Dashboard
</div>

<div class="subtitle">
Track and manage your sales pipeline.
</div>

</div>


<button
class="add-btn"
onclick="addLead()">

+ Add Lead

</button>

</div>


<!-- STATISTICS -->

<div class="stats">

<div class="card">

<div class="card-title">
Total Leads
</div>

<div
class="card-value"
id="totalLeads">

0

</div>

</div>


<div class="card">

<div class="card-title">
New Leads
</div>

<div
class="card-value"
id="newLeads">

0

</div>

</div>


<div class="card">

<div class="card-title">
Qualified
</div>

<div
class="card-value"
id="qualifiedLeads">

0

</div>

</div>


<div class="card">

<div class="card-title">
Conversion Rate
</div>

<div
class="card-value"
id="conversionRate">

0%

</div>

</div>

</div>


<!-- RECENT LEADS -->

<div class="panel">

<div class="panel-header">

<div class="panel-title">
Recent Leads
</div>

<input
class="search"
id="search"
type="text"
placeholder="Search leads..."
oninput="searchLeads()"
>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
COMPANY
</th>

<th>
CONTACT
</th>

<th>
STATUS
</th>

<th>
ACTIVITY
</th>

</tr>

</thead>


<tbody id="leadTable">

<tr>

<td colspan="4">

<div class="empty">
No leads yet
</div>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>


<script>

/* GET SAVED LEADS */

function getLeads(){

try{

return JSON.parse(
localStorage.getItem("clientflow_leads")
) || [];

}catch(error){

return [];

}

}


/* UPDATE DASHBOARD */

function updateDashboard(){

const leads=getLeads();

document.getElementById("totalLeads")
.innerText=leads.length;


const newCount=leads.filter(function(lead){

return lead.status==="New";

}).length;


const qualifiedCount=leads.filter(function(lead){

return lead.status==="Qualified";

}).length;


const convertedCount=leads.filter(function(lead){

return lead.status==="Converted";

}).length;


document.getElementById("newLeads")
.innerText=newCount;

document.getElementById("qualifiedLeads")
.innerText=qualifiedCount;


let rate=0;

if(leads.length>0){

rate=Math.round(
(convertedCount/leads.length)*100
);

}

document.getElementById("conversionRate")
.innerText=rate+"%";


displayLeads(leads);

}


/* DISPLAY LEADS */

function displayLeads(leads){

const table=document.getElementById("leadTable");

if(leads.length===0){

table.innerHTML=`

<tr>

<td colspan="4">

<div class="empty">
No leads yet
</div>

</td>

</tr>

`;

return;

}


table.innerHTML="";


leads.slice(0,10).forEach(function(lead){

const row=document.createElement("tr");

row.innerHTML=`

<td>
${lead.company || "-"}
</td>

<td>
${lead.contact || "-"}
</td>

<td>
${lead.status || "New"}
</td>

<td>
${lead.activity || "New lead added"}
</td>

`;

table.appendChild(row);

});

}


/* SEARCH */

function searchLeads(){

const query=document
.getElementById("search")
.value
.toLowerCase();

const leads=getLeads();

const filtered=leads.filter(function(lead){

return (

(lead.company || "")
.toLowerCase()
.includes(query)

||

(lead.contact || "")
.toLowerCase()
.includes(query)

||

(lead.status || "")
.toLowerCase()
.includes(query)

);

});

displayLeads(filtered);

}


/* ADD LEAD */

function addLead(){

const company=prompt(
"Enter company name:"
);

if(!company){

return;

}


const contact=prompt(
"Enter contact name:"
);

if(!contact){

return;

}


const leads=getLeads();


leads.unshift({

id:Date.now(),

company:company,

contact:contact,

status:"New",

activity:"New lead added"

});


localStorage.setItem(
"clientflow_leads",
JSON.stringify(leads)
);


updateDashboard();

}


/* LOAD */

updateDashboard();

</script>

</body>
</html>
