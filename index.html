<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ClientFlow — Lead Management</title>

  <meta
    name="description"
    content="ClientFlow is a modern lead management platform for organizing prospects, companies and sales activity."
  >

  <style>
    :root {
      --background: #f5f7fb;
      --surface: #ffffff;
      --dark: #111827;
      --dark-light: #1f2937;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP LAYOUT
    ========================= */

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 250px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;

      background: var(--dark);
      color: white;

      padding: 24px 16px;
      z-index: 100;

      transition: transform 0.25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 10px 30px;

      font-size: 21px;
      font-weight: 700;
    }

    .brand-icon {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      background: var(--primary);
      border-radius: 10px;

      font-weight: 800;
    }

    .navigation {
      display: grid;
      gap: 6px;
    }

    .navigation button {
      width: 100%;

      border: none;
      background: transparent;

      color: #9ca3af;

      padding: 12px;
      border-radius: 9px;

      text-align: left;

      transition: 0.2s;
    }

    .navigation button:hover,
    .navigation button.active {
      background: var(--dark-light);
      color: white;
    }

    .sidebar-footer {
      position: absolute;
      bottom: 25px;
      left: 16px;
      right: 16px;

      padding-top: 18px;

      border-top: 1px solid #374151;

      color: #9ca3af;
      font-size: 12px;
      line-height: 1.6;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      width: calc(100% - 250px);
      margin-left: 250px;

      padding: 30px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 30px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .topbar p {
      color: var(--muted);
      font-size: 14px;
    }
