<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClientFlow - Contacts</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#111827;
}

button,input,select{
font:inherit;
}

/* SIDEBAR */

.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:163px;
background:#101827;
padding:15px 10px;
}

.brand{
display:flex;
align-items:center;
gap:7px;
color:#fff;
font-size:14px;
font-weight:700;
margin-bottom:28px;
}

.brand-icon{
width:26px;
height:26px;
border-radius:6px;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:bold;
}

.nav{
list-style:none;
}

.nav li{
margin-bottom:4px;
}

.nav a{
display:block;
padding:9px;
border-radius:7px;
text-decoration:none;
color:#9ca3af;
font-size:11px;
}

.nav a:hover,
.nav a.active{
background:#1d293b;
color:#fff;
}

/* MAIN */

.main{
margin-left:163px;
min-height:100vh;
padding:20px;
}

/* HEADER */

.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.title{
font-size:21px;
font-weight:700;
}

.subtitle{
font-size:10px;
color:#8b95a5;
margin-top:3px;
}

.btn{
border:0;
border-radius:6px;
padding:9px 13px;
font-size:10px;
font-weight:600;
cursor:pointer;
}

.primary{
background:#2563eb;
color:#fff;
}

.primary:hover{
background:#1d4ed8;
}

.secondary{
background:#fff;
color:#374151;
border:1px solid #dfe3e8;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:18px;
}

.card{
background:#fff;
border:1px solid #e7eaf0;
border-radius:9px;
padding:15px;
}

.card-title{
font-size:9px;
color:#7b8492;
margin-bottom:7px;
}

.card-value{
font-size:20px;
font-weight:700;
}

/* PANEL */

.panel{
background:#fff;
border:1px solid #e7eaf0;
border-radius:9px;
overflow:hidden;
}

.panel-header{
min-height:52px;
padding:10px 14px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border-bottom:1px solid #edf0f4;
}

.panel-title{
font-size:13px;
font-weight:700;
}

.tools{
display:flex;
gap:7px;
}

.search{
width:180px;
height:30px;
border:1px solid #dfe3e8;
border-radius:6px;
padding:0 10px;
font-size:10px;
outline:none;
}

.search:focus{
border-color:#2563eb;
}

/* TABLE */

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:750px;
}

th{
padding:10px 14px;
text-align:left;
font-size:8px;
color:#7b8492;
font-weight:700;
border-bottom:1px solid #edf0f4;
}

td{
padding:12px 14px;
font-size:10px;
border-bottom:1px solid #f0f2f5;
}

tr:last-child td{
border-bottom:0;
}

tr:hover td{
background:#fafbfc;
}

.name{
font-weight:600;
}

.small{
font-size:9px;
color:#8b95a5;
margin-top:3px;
}

.badge{
display:inline-block;
padding:4px 7px;
border-radius:20px;
font-size:8px;
font-weight:600;
}

.active-badge{
background:#dcfce7;
color:#15803d;
}

.inactive-badge{
background:#f3f4f6;
color:#6b7280;
}

.action{
border:1px solid #e1e5eb;
background:#fff;
border-radius:5px;
padding:5px 7px;
font-size:9px;
cursor:pointer;
}

.action:hover{
background:#f3f4f6;
}

.empty{
text-align:center;
padding:35px 15px;
color:#9ca3af;
font-size:11px;
}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(15,23,42,.55);
z-index:100;
align-items:center;
justify-content:center;
padding:15px;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:500px;
max-height:92vh;
overflow-y:auto;
background:#fff;
border-radius:10px;
padding:20px;
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.modal-head h2{
font-size:17px;
}

.close{
border:0;
background:none;
font-size:22px;
color:#6b7280;
cursor:pointer;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.field.full{
grid-column:1/-1;
}

.field label{
display:block;
font-size:9px;
font-weight:600;
color:#374151;
margin-bottom:5px;
}

.field input,
.field select{
width:100%;
height:36px;
border:1px solid #dfe3e8;
border-radius:6px;
padding:0 9px;
font-size:10px;
outline:none;
background:#fff;
}

.field input:focus,
.field select:focus{
border-color:#2563eb;
}

.modal-actions{
display:flex;
justify-content:flex-end;
gap:7px;
margin-top:18px;
}

/* TOAST */

.toast{
position:fixed;
right:20px;
bottom:20px;
background:#111827;
color:#fff;
padding:10px 14px;
border-radius:7px;
font-size:10px;
opacity:0;
transform:translateY(10px);
transition:.25s;
z-index:200;
}

.toast.show{
opacity:1;
transform:translateY(0);
}

/* MOBILE */

@media(max-width:700px){

.sidebar{
width:130px;
}

.main{
margin-left:130px;
padding:12px;
}

.stats{
grid-template-columns:1fr;
}

.header{
align-items:flex-start;
gap:10px;
}

.panel-header{
align-items:flex-start;
flex-direction:column;
}

.tools{
width:100%;
}

.search{
width:100%;
}

.form-grid{
grid-template-columns:1fr;
}

.field.full{
grid-column:auto;
}

}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="brand">
<div class="brand-icon">C</div>
<span>ClientFlow</span>
</div>

<ul class="nav">

<li>
<a href="index.html">
Dashboard
</a>
</li>

<li>
<a href="leads.html">
Leads
</a>
</li>

<li>
<a href="companies.html">
Companies
</a>
</li>

<li>
<a href="contacts.html" class="active">
Contacts
</a>
</li>

<li>
<a href="deals.html">
Deals
</a>
</li>

<li>
<a href="tasks.html">
Tasks
</a>
</li>

<li>
<a href="reports.html">
Reports
</a>
</li>

<li>
<a href="settings.html">
Settings
</a>
</li>

</ul>

</aside>


<!-- MAIN -->

<main class="main">

<div class="header">

<div>

<div class="title">
Contacts
</div>

<div class="subtitle">
Manage people connected to your companies and leads.
</div>

</div>

<button
class="btn primary"
onclick="openModal()">

+ Add Contact

</button>

</div>


<!-- STATS -->

<div class="stats">

<div class="card">

<div class="card-title">
Total Contacts
</div>

<div
class="card-value"
id="totalContacts">

0

</div>

</div>


<div class="card">

<div class="card-title">
Active Contacts
</div>

<div
class="card-value"
id="activeContacts">

0

</div>

</div>


<div class="card">

<div class="card-title">
Companies
</div>

<div
class="card-value"
id="companyCount">

0

</div>

</div>

</div>


<!-- CONTACTS TABLE -->

<div class="panel">

<div class="panel-header">

<div class="panel-title">
All Contacts
</div>

<div class="tools">

<input
class="search"
id="search"
placeholder="Search contacts..."
oninput="renderContacts()">

</div>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
CONTACT
</th>

<th>
COMPANY
</th>

<th>
EMAIL
</th>

<th>
PHONE
</th>

<th>
STATUS
</th>

<th>
ACTIONS
</th>

</tr>

</thead>

<tbody id="contactTable">

</tbody>

</table>

</div>

</div>

</main>


<!-- MODAL -->

<div
class="modal"
id="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">
Add Contact
</h2>

<button
class="close"
onclick="closeModal()">

×

</button>

</div>


<div class="form-grid">

<div class="field">

<label>
Full Name
</label>

<input
id="name"
placeholder="Contact name">

</div>


<div class="field">

<label>
Company
</label>

<input
id="company"
placeholder="Company name">

</div>


<div class="field">

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="Email address">

</div>


<div class="field">

<label>
Phone
</label>

<input
id="phone"
placeholder="Phone number">

</div>


<div class="field">

<label>
Job Title
</label>

<input
id="role"
placeholder="Job title">

</div>


<div class="field">

<label>
Status
</label>

<select id="status">

<option>Active</option>
<option>Inactive</option>

</select>

</div>

</div>


<div class="modal-actions">

<button
class="btn secondary"
onclick="closeModal()">

Cancel

</button>

<button
class="btn primary"
onclick="saveContact()">

Save Contact

</button>

</div>

</div>

</div>


<div
class="toast"
id="toast">
</div>


<script>

const CONTACT_KEY="clientflow_contacts";

let editingId=null;


/* GET CONTACTS */

function getContacts(){

try{

return JSON.parse(
localStorage.getItem(CONTACT_KEY)
)||[];

}catch(error){

return[];

}

}


/* SAVE CONTACTS */

function saveContacts(data){

localStorage.setItem(
CONTACT_KEY,
JSON.stringify(data)
);

}


/* OPEN MODAL */

function openModal(id=null){

editingId=id;

document
.getElementById("modal")
.classList.add("show");


if(id){

const contact=getContacts()
.find(function(item){

return item.id===id;

});


if(!contact)return;


document.getElementById("modalTitle")
.innerText="Edit Contact";

document.getElementById("name")
.value=contact.name||"";

document.getElementById("company")
.value=contact.company||"";

document.getElementById("email")
.value=contact.email||"";

document.getElementById("phone")
.value=contact.phone||"";

document.getElementById("role")
.value=contact.role||"";

document.getElementById("status")
.value=contact.status||"Active";

}

}


/* CLOSE MODAL */

function closeModal(){

document
.getElementById("modal")
.classList.remove("show");

editingId=null;

clearForm();

}


/* CLEAR FORM */

function clearForm(){

document.getElementById("name").value="";
document.getElementById("company").value="";
document.getElementById("email").value="";
document.getElementById("phone").value="";
document.getElementById("role").value="";
document.getElementById("status").value="Active";

}


/* SAVE CONTACT */

function saveContact(){

const name=
document.getElementById("name")
.value.trim();

const company=
document.getElementById("company")
.value.trim();

if(!name){

showToast("Contact name is required");

return;

}


const contacts=getContacts();


const data={

name:name,

company:company,

email:
document.getElementById("email")
.value.trim(),

phone:
document.getElementById("phone")
.value.trim(),

role:
document.getElementById("role")
.value.trim(),

status:
document.getElementById("status")
.value

};


if(editingId){

const index=contacts.findIndex(
function(contact){

return contact.id===editingId;

}
);


if(index!==-1){

contacts[index]={
...contacts[index],
...data
};

}

showToast("Contact updated");

}else{

data.id=Date.now();

data.created=
new Date().toISOString();

contacts.unshift(data);

showToast("Contact added");

}


saveContacts(contacts);

closeModal();

renderContacts();

updateStats();

}


/* DELETE CONTACT */

function deleteContact(id){

const contacts=getContacts();

const contact=contacts.find(
function(item){

return item.id===id;

}
);

if(!contact)return;


if(!confirm(
"Delete "+contact.name+"?"
)){

return;

}


const updated=contacts.filter(
function(item){

return item.id!==id;

}
);

saveContacts(updated);

renderContacts();

updateStats();

showToast("Contact deleted");

}


/* RENDER */

function renderContacts(){

const contacts=getContacts();

const query=
document.getElementById("search")
.value
.toLowerCase();


const filtered=contacts.filter(
function(contact){

return (

(contact.name||"")
.toLowerCase()
.includes(query)

||

(contact.company||"")
.toLowerCase()
.includes(query)

||

(contact.email||"")
.toLowerCase()
.includes(query)

||

(contact.phone||"")
.toLowerCase()
.includes(query)

||

(contact.role||"")
.toLowerCase()
.includes(query)

);

}
);


const table=
document.getElementById("contactTable");


if(!filtered.length){

table.innerHTML=`

<tr>

<td colspan="6">

<div class="empty">

No contacts found.<br><br>

Click "+ Add Contact" to create your first contact.

</div>

</td>

</tr>

`;

return;

}


table.innerHTML="";


filtered.forEach(function(contact){

const row=
document.createElement("tr");


const badge=
contact.status==="Active"
?
"active-badge"
:
"inactive-badge";


row.innerHTML=`

<td>

<div class="name">
${safe(contact.name)}
</div>

<div class="small">
${safe(contact.role||"")}
</div>

</td>


<td>
${safe(contact.company||"-")}
</td>


<td>
${safe(contact.email||"-")}
</td>


<td>
${safe(contact.phone||"-")}
</td>


<td>

<span class="badge ${badge}">

${safe(contact.status)}

</span>

</td>


<td>

<button
class="action"
onclick="openModal(${contact.id})">

Edit

</button>

<button
class="action"
onclick="deleteContact(${contact.id})">

Delete

</button>

</td>

`;


table.appendChild(row);

});

}


/* STATS */

function updateStats(){

const contacts=getContacts();

const total=contacts.length;

const active=contacts.filter(
function(contact){

return contact.status==="Active";

}
).length;


const companies=new Set(
contacts
.map(function(contact){

return contact.company;

})
.filter(Boolean)
).size;


document.getElementById("totalContacts")
.innerText=total;

document.getElementById("activeContacts")
.innerText=active;

document.getElementById("companyCount")
.innerText=companies;

}


/* SAFE HTML */

function safe(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* TOAST */

let toastTimer;

function showToast(message){

const toast=
document.getElementById("toast");

toast.innerText=message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=setTimeout(
function(){

toast.classList.remove("show");

},
2200
);

}


/* CLOSE OUTSIDE */

document
.getElementById("modal")
.addEventListener(
"click",
function(event){

if(event.target===this){

closeModal();

}

}
);


/* ESCAPE */

document.addEventListener(
"keydown",
function(event){

if(event.key==="Escape"){

closeModal();

}

}
);


/* START */

renderContacts();

updateStats();

</script>

</body>
</html>
