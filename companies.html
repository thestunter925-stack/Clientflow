<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClientFlow — Companies</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;
--line:#e5e7eb;--blue:#2563eb;--dark:#101827
}
*{font-family:Arial,Helvetica,sans-serif}
body{background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}

.side{
position:fixed;left:0;top:0;bottom:0;width:225px;
background:var(--dark);color:#fff;padding:18px 12px;z-index:20
}
.logo{font-size:22px;font-weight:bold;padding:8px 12px 25px}
.logo span{color:#60a5fa}
.workspace{
background:#1c2738;padding:10px;border-radius:8px;
font-size:12px;margin-bottom:18px
}
.navtitle{font-size:10px;color:#718096;padding:8px 12px}
.nav button{
width:100%;border:0;background:transparent;color:#aeb8c9;
padding:10px 12px;text-align:left;border-radius:7px;
margin:2px 0;font-size:13px
}
.nav button:hover,.nav button.active{
background:#243247;color:#fff
}

.main{margin-left:225px;padding:20px;max-width:1500px}

.top{
display:flex;align-items:center;gap:12px;margin-bottom:22px
}
.menu{
display:none;padding:9px;border:1px solid var(--line);
background:var(--card);border-radius:7px
}
.search{flex:1;max-width:500px}
.search input{
width:100%;padding:11px 14px;border:1px solid var(--line);
border-radius:8px;background:var(--card);outline:0
}
.actions{display:flex;gap:8px}
.btn{
border:0;border-radius:8px;padding:10px 14px;
font-size:12px;font-weight:bold
}
.primary{background:var(--blue);color:white}
.secondary{
background:var(--card);color:var(--text);
border:1px solid var(--line)
}

.head{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:20px
}
.head h1{font-size:25px}
.head p{color:var(--muted);font-size:13px;margin-top:5px}

.stats{
display:grid;grid-template-columns:repeat(4,1fr);
gap:13px;margin-bottom:18px
}
.card{
background:var(--card);border:1px solid var(--line);
border-radius:11px;padding:16px
}
.stat small{color:var(--muted);font-size:11px}
.stat strong{display:block;font-size:24px;margin:9px 0}
.stat span{font-size:11px;color:#16a34a}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.company{
background:var(--card);
border:1px solid var(--line);
border-radius:11px;
padding:16px;
transition:.15s
}

.company:hover{
transform:translateY(-2px);
box-shadow:0 6px 20px #0000000c
}

.companyTop{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:13px
}

.avatar{
width:42px;
height:42px;
border-radius:9px;
background:#eff6ff;
color:var(--blue);
display:grid;
place-items:center;
font-weight:bold
}

.company h3{
font-size:14px;
margin-bottom:4px
}

.company p{
font-size:11px;
color:var(--muted)
}

.companyInfo{
border-top:1px solid var(--line);
padding-top:12px;
margin-top:12px
}

.info{
display:flex;
justify-content:space-between;
font-size:11px;
margin:7px 0
}

.info span{
color:var(--muted)
}

.companyActions{
display:flex;
gap:6px;
margin-top:14px
}

.companyActions button{
flex:1;
border:1px solid var(--line);
background:var(--card);
border-radius:7px;
padding:7px;
font-size:10px
}

.empty{
grid-column:1/-1;
padding:40px;
text-align:center;
color:var(--muted);
font-size:12px
}

@media(max-width:1000px){
.grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:900px){
.side{
transform:translateX(-100%);
transition:.2s
}
.side.open{transform:translateX(0)}
.main{margin-left:0}
.menu{display:block}
.stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
.main{padding:12px}
.head{display:block}
.head .actions{margin-top:12px}
.stats{gap:8px}
.stat{padding:13px}
.stat strong{font-size:20px}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<aside class="side" id="side">

<div class="logo">
Client<span>Flow</span>
</div>

<div class="workspace">
● My Workspace
</div>

<div class="navtitle">MAIN</div>

<nav class="nav">

<button onclick="go('index.html')">
⌂ &nbsp; Dashboard
</button>

<button onclick="go('leads.html')">
◆ &nbsp; Leads
</button>

<button onclick="go('contacts.html')">
◉ &nbsp; Contacts
</button>

<button class="active">
▣ &nbsp; Companies
</button>

<button onclick="go('deals.html')">
◇ &nbsp; Deals
</button>

<button onclick="go('tasks.html')">
✓ &nbsp; Tasks
</button>

<div class="navtitle">INSIGHTS</div>

<button onclick="go('reports.html')">
▥ &nbsp; Reports
</button>

<div class="navtitle">SYSTEM</div>

<button onclick="go('settings.html')">
⚙ &nbsp; Settings
</button>

</nav>

</aside>

<main class="main">

<div class="top">

<button class="menu" onclick="toggleSide()">
☰
</button>

<div class="search">

<input
id="topSearch"
placeholder="Search companies..."
oninput="filterCompanies()"
>

</div>

<div class="actions">

<button
class="btn secondary"
onclick="toggleDark()"
>
☾
</button>

<button
class="btn primary"
onclick="openCompany()"
>
+ Add Company
</button>

</div>

</div>

<header class="head">

<div>

<h1>Companies</h1>

<p>
Manage accounts and organizations connected to your CRM.
</p>

</div>

<div class="actions">

<button
class="btn secondary"
onclick="exportCompanies()"
>
Export
</button>

<button
class="btn primary"
onclick="openCompany()"
>
+ Add Company
</button>

</div>

</header>

<section class="stats">

<div class="card stat">
<small>Total Companies</small>
<strong id="total">0</strong>
<span>All accounts</span>
</div>

<div class="card stat">
<small>Contacts</small>
<strong id="contacts">0</strong>
<span>People connected</span>
</div>

<div class="card stat">
<small>Leads</small>
<strong id="leads">0</strong>
<span>Company prospects</span>
</div>

<div class="card stat">
<small>Active Accounts</small>
<strong id="active">0</strong>
<span>Current accounts</span>
</div>

</section>

<section class="card" style="margin-bottom:18px">

<input
id="companySearch"
placeholder="Search company name, industry or website..."
oninput="filterCompanies()"
style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);outline:0"
>

</section>

<section class="grid" id="companyGrid"></section>

</main>
<!-- COMPANY MODAL -->

<div class="overlay" id="overlay">

<div class="modal">

<div class="modalHead">

<h3 id="modalTitle">
Add Company
</h3>

<button onclick="closeCompany()">×</button>

</div>

<div class="form">

<label>Company Name</label>

<input
id="name"
placeholder="Company name"
>

<label>Industry</label>

<input
id="industry"
placeholder="e.g. SaaS, Marketing, Technology"
>

<label>Website</label>

<input
id="website"
placeholder="https://example.com"
>

<label>Phone</label>

<input
id="phone"
placeholder="+91..."
>

</div>

<div class="modalFoot">

<button
class="btn secondary"
onclick="closeCompany()"
>
Cancel
</button>

<button
class="btn primary"
onclick="saveCompany()"
>
Save Company
</button>

</div>

</div>

</div>

<div class="toast" id="toast"></div>

<style>

.overlay{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
align-items:center;
justify-content:center;
padding:15px
}

.modal{
width:100%;
max-width:430px;
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
overflow:hidden
}

.modalHead{
padding:15px 17px;
border-bottom:1px solid var(--line);
display:flex;
justify-content:space-between;
align-items:center
}

.modalHead h3{
font-size:16px
}

.modalHead button{
border:0;
background:transparent;
font-size:22px;
color:var(--muted)
}

.form{
padding:17px
}

.form label{
display:block;
font-size:11px;
font-weight:bold;
margin-bottom:5px
}

.form input{
width:100%;
padding:10px;
border:1px solid var(--line);
border-radius:7px;
background:var(--card);
color:var(--text);
outline:0;
margin-bottom:13px
}

.form input:focus{
border-color:var(--blue)
}

.modalFoot{
padding:13px 17px;
border-top:1px solid var(--line);
display:flex;
justify-content:flex-end;
gap:7px
}

.toast{
position:fixed;
right:15px;
bottom:15px;
background:#111827;
color:#fff;
padding:11px 15px;
border-radius:8px;
font-size:12px;
display:none;
z-index:200
}

body.dark{
--bg:#0b1120;
--card:#111827;
--text:#f3f4f6;
--muted:#9ca3af;
--line:#263244;
--dark:#070d18
}

body.dark .avatar{
background:#172554;
}

</style>

<script>

const COMPANY_KEY="clientflow_companies";

let editId=null;

function getCompanies(){

try{

const data=
JSON.parse(
localStorage.getItem(COMPANY_KEY)
);

if(Array.isArray(data))
return data;

}catch(e){}

const defaults=[

{
id:1,
name:"Acme Technologies",
industry:"Technology",
website:"https://example.com",
phone:"+91 98765 43210"
},

{
id:2,
name:"Growth Labs",
industry:"Marketing",
website:"https://example.com",
phone:"+91 98765 12345"
},

{
id:3,
name:"Nova Systems",
industry:"SaaS",
website:"https://example.com",
phone:"+91 99887 77665"
}

];

localStorage.setItem(
COMPANY_KEY,
JSON.stringify(defaults)
);

return defaults;

}

function setCompanies(data){

localStorage.setItem(
COMPANY_KEY,
JSON.stringify(data)
);

}

function safe(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function initials(name){

return String(name||"CO")
.trim()
.split(/\s+/)
.slice(0,2)
.map(x=>x[0])
.join("")
.toUpperCase();

}

function render(){

const companies=
getCompanies();

document.getElementById(
"total"
).textContent=
companies.length;

const contacts=
getData("clientflow_contacts");

const leads=
getData("clientflow_leads");

document.getElementById(
"contacts"
).textContent=
contacts.length;

document.getElementById(
"leads"
).textContent=
leads.length;

document.getElementById(
"active"
).textContent=
companies.length;

filterCompanies();

}

function getData(key){

try{

const data=
JSON.parse(
localStorage.getItem(key)||"[]"
);

return Array.isArray(data)
?data:[];

}catch(e){

return [];

}

}

function filterCompanies(){

const companies=
getCompanies();

const a=
document.getElementById(
"topSearch"
).value.toLowerCase();

const b=
document.getElementById(
"companySearch"
).value.toLowerCase();

const query=a||b;

const result=
companies.filter(c=>{

if(!query)
return true;

return(

String(c.name||"")
.toLowerCase()
.includes(query)||

String(c.industry||"")
.toLowerCase()
.includes(query)||

String(c.website||"")
.toLowerCase()
.includes(query)

);

});

renderCompanies(result);

}

function renderCompanies(companies){

const grid=
document.getElementById(
"companyGrid"
);

if(!companies.length){

grid.innerHTML=`

<div class="empty">
No companies found
</div>

`;

return;

}

grid.innerHTML=
companies.map(c=>`

<article class="company">

<div class="companyTop">

<div class="avatar">
${safe(initials(c.name))}
</div>

<div class="companyActions" style="margin:0">

<button
onclick="editCompany(${c.id})"
>
Edit
</button>

</div>

</div>

<h3>
${safe(c.name)}
</h3>

<p>
${safe(c.industry||"Business")}
</p>

<div class="companyInfo">

<div class="info">
<span>Website</span>
<b>${safe(c.website||"—")}</b>
</div>

<div class="info">
<span>Phone</span>
<b>${safe(c.phone||"—")}</b>
</div>

</div>

<div class="companyActions">

<button
onclick="viewCompany(${c.id})"
>
View
</button>

<button
onclick="deleteCompany(${c.id})"
>
Delete
</button>

</div>

</article>

`)
.join("");

}

function openCompany(){

editId=null;

document.getElementById(
"modalTitle"
).textContent="Add Company";

document.getElementById(
"name"
).value="";

document.getElementById(
"industry"
).value="";

document.getElementById(
"website"
).value="";

document.getElementById(
"phone"
).value="";

document.getElementById(
"overlay"
).style.display="flex";

setTimeout(()=>{

document
.getElementById("name")
.focus();

},50);

}

function editCompany(id){

const company=
getCompanies()
.find(x=>x.id===id);

if(!company)
return;

editId=id;

document.getElementById(
"modalTitle"
).textContent="Edit Company";

document.getElementById(
"name"
).value=company.name||"";

document.getElementById(
"industry"
).value=company.industry||"";

document.getElementById(
"website"
).value=company.website||"";

document.getElementById(
"phone"
).value=company.phone||"";

document.getElementById(
"overlay"
).style.display="flex";

}

function closeCompany(){

document.getElementById(
"overlay"
).style.display="none";

editId=null;

}

function saveCompany(){

const name=
document.getElementById(
"name"
).value.trim();

const industry=
document.getElementById(
"industry"
).value.trim();

const website=
document.getElementById(
"website"
).value.trim();

const phone=
document.getElementById(
"phone"
).value.trim();

if(!name){

toast("Enter company name");

return;

}

const companies=
getCompanies();

if(editId){

const c=
companies.find(x=>x.id===editId);

if(c){

c.name=name;
c.industry=industry;
c.website=website;
c.phone=phone;

}

toast("Company updated");

}else{

companies.push({

id:Date.now(),
name:name,
industry:industry,
website:website,
phone:phone,
createdAt:new Date().toISOString()

});

toast("Company added");

}

setCompanies(companies);

closeCompany();

render();

}

function deleteCompany(id){

const company=
getCompanies()
.find(x=>x.id===id);

if(!company)
return;

if(!confirm(
"Delete "+company.name+"?"
))
return;

const companies=
getCompanies()
.filter(x=>x.id!==id);

setCompanies(companies);

render();

toast("Company deleted");

}

function viewCompany(id){

const company=
getCompanies()
.find(x=>x.id===id);

if(!company)
return;

alert(
"Company: "+company.name+
"\nIndustry: "+(company.industry||"—")+
"\nWebsite: "+(company.website||"—")+
"\nPhone: "+(company.phone||"—")
);

}

function exportCompanies(){

const companies=
getCompanies();

const rows=[
["Company","Industry","Website","Phone"],
...companies.map(x=>[
x.name,
x.industry,
x.website,
x.phone
])
];

const csv=
rows.map(row=>
row.map(v=>
'"'+String(v||"")
.replaceAll('"','""')+'"'
).join(",")
).join("\n");

const blob=
new Blob([csv],{
type:"text/csv"
});

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download="clientflow-companies.csv";
a.click();

URL.revokeObjectURL(url);

toast("Companies exported");

}

function go(url){

window.location.href=url;

}

function toggleSide(){

document
.getElementById("side")
.classList.toggle("open");

}

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"clientflow_dark",
document.body.classList.contains("dark")
);

}

function toast(text){

const box=
document.getElementById("toast");

box.textContent=text;
box.style.display="block";

clearTimeout(window.toastTimer);

window.toastTimer=
setTimeout(()=>{

box.style.display="none";

},2000);

}

if(
localStorage.getItem(
"clientflow_dark"
)==="true"
){

document.body.classList.add("dark");

}

document
.getElementById("overlay")
.addEventListener(
"click",
e=>{

if(e.target.id==="overlay")
closeCompany();

});

render();

</script>
<script>

document.addEventListener(
"click",
function(e){

const side=
document.getElementById("side");

const menu=
document.querySelector(".menu");

if(
window.innerWidth<=900 &&
side.classList.contains("open") &&
!side.contains(e.target) &&
!menu.contains(e.target)
){

side.classList.remove("open");

}

});

document.addEventListener(
"keydown",
function(e){

if(
(e.ctrlKey||e.metaKey)&&
e.key.toLowerCase()==="k"
){

e.preventDefault();

document
.getElementById("topSearch")
.focus();

}

if(e.key==="Escape"){

closeCompany();

}

});

window.addEventListener(
"storage",
function(){

render();

});

document.addEventListener(
"visibilitychange",
function(){

if(!document.hidden)
render();

});

render();

</script>

</body>
</html>
